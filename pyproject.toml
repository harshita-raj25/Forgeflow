[project]
name = "forgeflow"
version = "0.1.0"
description = "ForgeFlow: agentic SDLC workbench that generates and evolves a URL shortener under governed orchestration"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "jsonschema==4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.8",
]

[project.scripts]
forgeflow = "coordinator.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coordinator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: requires a local Docker daemon",
    "live: requires OPENAI_API_KEY and makes real provider calls",
]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 140
target-version = "py313"
extend-exclude = ["fixtures", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: FastAPI's Form(...)/Depends(...) defaults are the framework's idiom
